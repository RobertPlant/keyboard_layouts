[package]
name = "keycaps"
version = "0.1.0"
edition = "2021"
description = "Prints the YUZU keycap design for the ErgoDox keymap"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
as_conversions = "deny"
must_use_candidate = "warn"
